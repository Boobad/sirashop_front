<div class="login-container">
  <div class="login-card">
    <div class="logo">
      <img src="assets/logo.png" alt="SiraShop Logo" class="login-brand-logo">
      <h1>SiraShop</h1>
      <p class="tagline">Plateforme de Gestion Multi-Boutiques</p>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Identifiant / Nom d'utilisateur</label>
        <input 
          type="text" 
          id="username" 
          [(ngModel)]="username" 
          name="username"
          placeholder="Entrez votre identifiant..."
          required
        >
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="password" 
          name="password"
          placeholder="••••••••"
          required
        >
      </div>

      <button type="submit" [disabled]="loading" class="btn-login">
        {{ loading ? 'Connexion en cours...' : 'SE CONNECTER' }}
      </button>
    </form>

    <div class="login-footer">
      <p class="secure-badge">🔒 Connexion sécurisée SiraShop</p>
    </div>
  </div>
</div>
