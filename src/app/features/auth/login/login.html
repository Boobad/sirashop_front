<div class="login-wrapper">
  <!-- ARRIÈRE-PLAN SPATIAL HAUTE DENSITÉ (ÉTOILES, LUNE 3D ET NEBULEUSES) -->
  <div class="space-background">
    <!-- Champ d'étoiles dense -->
    <div class="stars-far"></div>
    <div class="stars-mid"></div>
    <div class="stars-close"></div>
    <div class="stardust"></div>
    <div class="twinkling"></div>

    <!-- Nébuleuse lumineuse cosmique -->
    <div class="nebula"></div>

    <!-- LUNE REALISTE DE L'ESPACE EN 3D -->
    <div class="moon-container">
      <div class="moon">
        <div class="moon-crater c1"></div>
        <div class="moon-crater c2"></div>
        <div class="moon-crater c3"></div>
        <div class="moon-crater c4"></div>
      </div>
    </div>

    <!-- Étoiles Filantes -->
    <div class="shooting-star star-1"></div>
    <div class="shooting-star star-2"></div>
    <div class="shooting-star star-3"></div>
    <div class="shooting-star star-4"></div>
  </div>

  <!-- CARTE DE CONNEXION GLASSMORPHIC -->
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <img src="assets/logo.png" alt="SiraShop Logo" class="login-brand-logo">
        <h1>SiraShop</h1>
        <p class="tagline">Plateforme de Gestion Boutiques</p>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="form-group">
          <label for="username">Identifiant / Nom d'utilisateur</label>
          <input 
            type="text" 
            id="username" 
            [(ngModel)]="username" 
            name="username"
            placeholder="Entrez votre identifiant..."
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input 
            type="password" 
            id="password" 
            [(ngModel)]="password" 
            name="password"
            placeholder="••••••••"
            required
          >
        </div>

        <button type="submit" [disabled]="loading" class="btn-login">
          {{ loading ? 'Connexion en cours...' : 'SE CONNECTER' }}
        </button>
      </form>

      <div class="login-footer">
        <p class="secure-badge">🔒 Connexion sécurisée SiraShop</p>
      </div>
    </div>
  </div>
</div>
